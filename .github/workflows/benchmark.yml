name: Benchmark

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bench-1m:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python3 -m pip install numpy==2.2.6
      - name: Cache SIFT fixtures
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            fixtures/sift.tar.gz
            fixtures/sift1m.npy
            fixtures/sift1m_q100.npy
            fixtures/sift1m_gt100.npy
            fixtures/sift1m.usearch
          key: sift1m-${{ hashFiles('benchmarks/fetch_sift.sh', 'benchmarks/run_1m.sh') }}
      - name: Fetch and verify SIFT fixtures
        run: benchmarks/fetch_sift.sh
      - name: Build CLI
        run: cargo build --locked --release -p pqr-cli
      - name: Bootstrap pinned HNSW cache if absent
        run: |
          if [[ -f fixtures/sift1m.usearch ]]; then
            echo "using cached HNSW graph"
            exit 0
          fi
          echo "HNSW cache absent; generating it from pinned inputs"
          export PQR_BENCH_DIR="$GITHUB_WORKSPACE/target/bench-1m"
          mkdir -p "$PQR_BENCH_DIR"
          umask 077
          python3 - "$PQR_BENCH_DIR/seed.bin" <<'PY'
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(
              bytes.fromhex("f6d4447d718efc8069ebd632aad19f61783489666e160d135f0a81154efea736")
          )
          PY
          chmod 600 "$PQR_BENCH_DIR/seed.bin"
          ./target/release/pqr-guard build \
            --vectors fixtures/sift1m.npy --dim 128 --metric l2 \
            --partitions 2000 --code-bits 128 --iterations 5 \
            --seed-file "$PQR_BENCH_DIR/seed.bin" --out "$PQR_BENCH_DIR/index"
          ./target/release/pqr-guard bench \
            --index "$PQR_BENCH_DIR/index" --queries fixtures/sift1m_q100.npy \
            --seed-file "$PQR_BENCH_DIR/seed.bin" --k 10 --tau 1 --delta 0.01 \
            --nprobe 1 --repeat 1 --baseline usearch-hnsw \
            --hnsw-cache fixtures/sift1m.usearch \
            --report "$PQR_BENCH_DIR/bootstrap.json"
          actual=$(shasum -a 256 fixtures/sift1m.usearch | awk '{print $1}')
          test "$actual" = "c49c9ad5b3671200b18d58a9b49e73eaaf7ca7ae73d126e446676f95495d11fe"
      - name: Run 1M benchmark
        run: |
          if [[ -d target/bench-1m/index ]]; then
            benchmarks/run_1m.sh --reuse-index
          else
            benchmarks/run_1m.sh
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-report
          path: target/bench-1m/bench-report.json
          if-no-files-found: error
