name: Nightly audit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install numpy==2.2.6
      - name: Generate certified fixture
        run: |
          umask 077
          python - <<'PY'
          import numpy as np

          rng = np.random.default_rng(7)
          n, d = 1000, 16
          X = (rng.normal(size=(n, d)) + np.array([[1, 0] * (d // 2)])).astype(np.float32)
          np.save('nightly.npy', X)
          np.save('nightly_q.npy', X[:10])
          with open('nightly.seed', 'wb') as seed:
              seed.write(bytes(range(32)))
          PY
          chmod 600 nightly.seed
      - name: Build and audit
        run: |
          cargo run --locked --release --bin pqr-guard -- build \
            --vectors nightly.npy --partitions 10 --code-bits 8,16 \
            --seed-file nightly.seed --out nightly.idx
          cargo run --locked --release --bin pqr-guard -- audit \
            --index nightly.idx --queries nightly_q.npy --seed-file nightly.seed \
            --k 10 --tau 1 --delta 0.1 --rotations 1000 --nprobe 3 \
            --report nightly.audit.json
