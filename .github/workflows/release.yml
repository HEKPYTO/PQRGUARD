name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5
      - name: Build binaries
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --locked --release --target "${{ matrix.target }}" -p pqr-cli -p pqr-service
          else
            cargo build --locked --release --target "${{ matrix.target }}" -p pqr-cli -p pqr-service
          fi
          cp "target/${{ matrix.target }}/release/pqrguard" "pqrguard-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/pqr-serve" "pqr-serve-${{ matrix.target }}"
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.10
      - name: Generate CycloneDX SBOMs
        run: |
          cargo cyclonedx --format json --describe binaries --target "${{ matrix.target }}"
          mv crates/pqr-cli/pqrguard_bin.cdx.json "sbom-pqrguard-${{ matrix.target }}.cdx.json"
          mv crates/pqr-service/pqr-serve_bin.cdx.json "sbom-pqr-serve-${{ matrix.target }}.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pqr-binaries-${{ matrix.target }}
          path: |
            pqrguard-${{ matrix.target }}
            pqr-serve-${{ matrix.target }}
            sbom-pqrguard-${{ matrix.target }}.cdx.json
            sbom-pqr-serve-${{ matrix.target }}.cdx.json
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pqr-binaries-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cp Cargo.lock dist/
          cd dist
          sha256sum pqrguard-* pqr-serve-* sbom-*.cdx.json Cargo.lock > SHA256SUMS
      - uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-path: |
            dist/pqrguard-*
            dist/pqr-serve-*
            dist/sbom-*.cdx.json
            dist/Cargo.lock
            dist/SHA256SUMS
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign release artifacts
        run: |
          for file in dist/pqrguard-* dist/pqr-serve-* dist/sbom-*.cdx.json dist/Cargo.lock dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Signed release artifacts. Verify with SHA256SUMS, Sigstore bundles, and GitHub provenance."
