name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --release -- -D warnings
      - name: Tests
        run: cargo test --locked --release
      - name: Tracked markdown policy
        run: |
          test -z "$(git ls-files '*.md' | grep -vE '(^|/)README\.md$')"

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check advisories, licenses, bans, sources
        run: cargo deny check

  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit lockfile
        run: cargo audit --file Cargo.lock

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.10
      - name: Generate CycloneDX SBOMs
        run: |
          cargo cyclonedx --format json --describe binaries --target x86_64-unknown-linux-gnu
          mv crates/pqr-cli/pqrguard_bin.cdx.json sbom-pqrguard.cdx.json
          mv crates/pqr-service/pqr-serve_bin.cdx.json sbom-pqr-serve.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom-pqrguard.cdx.json
            sbom-pqr-serve.cdx.json
            Cargo.lock
          if-no-files-found: error

  bench-syntax:
    name: Benchmark syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check shell syntax
        run: bash -n benchmarks/*.sh
      - name: Check Python syntax
        run: python3 -m py_compile benchmarks/*.py
      - name: Build CLI
        run: cargo build --locked -p pqr-cli
      - name: Check CLI help
        run: |
          ./target/debug/pqrguard --help
          ./target/debug/pqrguard build --help
          ./target/debug/pqrguard bench --help
