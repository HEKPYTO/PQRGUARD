name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --release -- -D warnings
      - name: Tests
        run: cargo test --locked --release
      - name: Tracked markdown policy
        run: |
          test -z "$(git ls-files '*.md' | grep -vE '(^|/)README\.md$')"

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check advisories, licenses, bans, sources
        run: cargo deny check

  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit lockfile
        run: cargo audit --file Cargo.lock

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.10
      - name: Generate CycloneDX SBOMs
        run: |
          cargo cyclonedx --format json --describe binaries --target x86_64-unknown-linux-gnu
          mv crates/pqr-cli/pqr-guard_bin.cdx.json sbom-pqr-guard.cdx.json
          mv crates/pqr-service/pqr-serve_bin.cdx.json sbom-pqr-serve.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom-pqr-guard.cdx.json
            sbom-pqr-serve.cdx.json
            Cargo.lock
          if-no-files-found: error

  bench-syntax:
    name: Benchmark syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check shell syntax
        run: bash -n benchmarks/*.sh
      - name: Check Python syntax
        run: python3 -m py_compile benchmarks/*.py
      - name: Build CLI
        run: cargo build --locked -p pqr-cli
      - name: Check CLI help
        run: |
          ./target/debug/pqr-guard --help
          ./target/debug/pqr-guard build --help
          ./target/debug/pqr-guard bench --help
