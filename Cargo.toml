[workspace]
members = ["crates/pqr-core", "crates/pqr-cli", "crates/pqr-service"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
pqr-core = { path = "crates/pqr-core" }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
rayon = "1"
faer = { version = "0.24", default-features = false, features = ["std", "rayon", "linalg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
npyz = "0.9"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
